<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>球员模型测试</title>
    <style>
      :root { --bg: #0f1418; --panel: rgba(12, 18, 22, 0.84); --line: rgba(255, 255, 255, 0.12); --ink: #eef1f4; --dim: #9aa6b2; --acc: #d8ff3e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'PingFang SC', 'Noto Sans SC', sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .box { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
      #top { left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      #top h1 { margin: 0 10px 0 0; font-size: 16px; letter-spacing: 0.05em; }
      .chip { cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.07); color: var(--ink); border-radius: 7px; padding: 6px 11px; font: 600 13px inherit; }
      .chip.on { background: var(--acc); color: #10161b; border-color: var(--acc); }
      .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
      #bottom { left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      #scrub { flex: 1; min-width: 160px; accent-color: var(--acc); }
      #frame { font: 600 13px monospace; min-width: 9em; text-align: right; color: var(--dim); }
      #info { right: 12px; top: 120px; font-size: 12px; line-height: 1.7; color: #d6dde4; max-width: 260px; }
      #info b { color: var(--acc); font-weight: 600; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--dim); pointer-events: none; }
      @media (max-width: 720px) { #info { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="loading">加载模型中…</div>
    <div class="box" id="top">
      <h1>球员模型测试</h1>
      <span id="acts"></span>
      <span class="sep"></span>
      <span id="shows"></span>
      <span class="sep"></span>
      <span id="cams"></span>
    </div>
    <div class="box" id="info"></div>
    <div class="box" id="bottom">
      <button class="chip" id="play">❚❚ 暂停</button>
      <span id="speeds"></span>
      <input type="range" id="scrub" min="0" max="1" step="0.0005" value="0" />
      <span id="frame"></span>
    </div>
    <script type="module" src="/src/battertest.js"></script>
  </body>
</html>
